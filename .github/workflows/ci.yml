name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff
      - name: Lint (ruff)
        run: ruff check . --exclude __pycache__ --exclude .git || true
      # Start with non-blocking ruff until cleaned; still verify import
      - name: Import smoke
        run: python -c "import server; print('ok')"
      - name: Syntax check
        run: python -m compileall -q -x '(venv|__pycache__|\.git)' .
